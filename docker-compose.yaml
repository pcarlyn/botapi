services:
  mongodb:
    image: mongo:6
    container_name: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: appdb
      TZ: Europe/Moscow
    ports:
      - "27017:27017"
    networks:
      - appnetwork
    volumes:
      - mongo-data:/data/db


  api:
    build: .
    container_name: api-go
    command: go run main.go
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: mongo
      MONGO_PASSWORD: password
      MONGO_DBNAME: appdb
      TZ: Europe/Moscow
    depends_on:
      - mongodb
    networks:
      - appnetwork

networks:
  appnetwork:
    driver: bridge

volumes:
  mongo-data:
